<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquidity Trading Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#eaf2ff;
}

header{
  height:68px;
  background:#0b1728;
  border-bottom:1px solid #20334a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#45d39a;
}

.controls{
  display:flex;
  gap:8px;
}

select,
button{
  background:#102036;
  color:#eaf2ff;
  border:1px solid #29405b;
  border-radius:8px;
  padding:9px 12px;
}

button{
  cursor:pointer;
}

button:hover{
  border-color:#45d39a;
}

main{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:#0c192b;
  border:1px solid #1c3047;
  border-radius:12px;
  padding:16px;
}

.label{
  color:#8195ad;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.value{
  font-size:26px;
  font-weight:800;
  margin-top:8px;
}

.green{
  color:#45d39a;
}

.red{
  color:#ff6575;
}

.yellow{
  color:#f1ca68;
}

.muted{
  color:#71859d;
  font-size:12px;
  margin-top:6px;
}

.section{
  margin-top:16px;
}

.grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:16px;
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.title h2{
  font-size:16px;
  margin:0;
}

.badge{
  font-size:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#13263b;
  border:1px solid #29425d;
  color:#91a6bd;
}

.chart{
  height:390px;
}

.chart svg{
  width:100%;
  height:320px;
}

.levels{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.level{
  display:grid;
  grid-template-columns:100px 1fr 70px;
  gap:10px;
  align-items:center;
  font-size:12px;
}

.bar{
  height:10px;
  background:#172a40;
  border-radius:10px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  border-radius:10px;
}

.buy i{
  background:#45d39a;
}

.sell i{
  background:#ff6575;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:11px 8px;
  text-align:left;
  border-bottom:1px solid #1b2c40;
  font-size:12px;
}

th{
  color:#71859d;
  font-size:10px;
  text-transform:uppercase;
}

.buyrow{
  background:rgba(69,211,154,.03);
}

.sellrow{
  background:rgba(255,101,117,.03);
}

.pressure{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.pressure-number{
  font-size:55px;
  font-weight:900;
}

.footer{
  text-align:center;
  color:#5e7289;
  font-size:11px;
  padding:20px 0 5px;
}

@media(max-width:1000px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:15px;
  }

  .controls{
    gap:4px;
  }

  select,
  button{
    padding:7px;
    font-size:11px;
  }

  main{
    padding:12px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .card{
    padding:13px;
  }

  .value{
    font-size:19px;
  }

  .chart{
    height:330px;
  }

  .level{
    grid-template-columns:85px 1fr 60px;
  }
}
</style>
</head>

  <div class="logo">
    Liquidity <span>Trading Dashboard</span>
  </div>

  <div class="controls">

    <select id="symbol">
      <option>XAU/USD</option>
      <option>BTC/USD</option>
      <option>EUR/USD</option>
      <option>NIFTY</option>
    </select>

    <select id="timeframe">

      <option selected>15m</option>
      <option>1H</option>
      <option>4H</option>

    <button onclick="refreshDashboard()">
