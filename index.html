<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquidity Trader</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07111f;
  color:#eaf2ff;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:15px;
  flex-wrap:wrap;
}

.logo{
  font-size:26px;
  font-weight:bold;
}

.subtitle{
  color:#8798ad;
  font-size:13px;
  margin-top:5px;
}

.controls{
  display:flex;
  gap:8px;
}

select,
button{
  background:#0d1b2d;
  color:white;
  border:1px solid #263b56;
  border-radius:8px;
  padding:10px 12px;
}

button{
  cursor:pointer;
  background:#15508b;
}

button:hover{
  background:#1d68ad;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:#0d1a2b;
  border:1px solid #20354f;
  border-radius:12px;
  padding:16px;
}

.label{
  color:#8798ad;
  font-size:12px;
}

.value{
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}

.green{
  color:#29d17b;
}

.red{
  color:#ff6075;
}

.blue{
  color:#65aaff;
}

.section{
  margin-top:15px;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

.two-column{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #1b2c42;
}

.row:last-child{
  border-bottom:none;
}

.badge{
  border:1px solid #30445d;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid #1b2c42;
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.check{
  background:#0a1626;
  border:1px solid #20354f;
  padding:12px;
  border-radius:8px;
}

.status{
  margin-top:10px;
  color:#8798ad;
  font-size:12px;
}

.error{
  margin-top:12px;
  color:#ff6075;
}

.footer{
  color:#6f8197;
  font-size:11px;
  margin-top:20px;
  padding-bottom:20px;
}

@media(max-width:850px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .two-column{
    grid-template-columns:1fr;
  }

}

    padding:12
